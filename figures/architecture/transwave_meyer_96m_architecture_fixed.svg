<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
  <style>.title{font:700 35px Arial,sans-serif;fill:#10213d}.sub{font:18px Arial,sans-serif;fill:#41536f}.h{font:700 20px Arial,sans-serif;fill:#10213d}.t{font:16px Arial,sans-serif;fill:#26364f}.small{font:14px Arial,sans-serif;fill:#41536f}.box{fill:#f7fbff;stroke:#78a9df;stroke-width:2}.box2{fill:#f6fffc;stroke:#68bfa8;stroke-width:2}.inner{fill:#ffffff;stroke:#b8cce2;stroke-width:1.5}.arrow{stroke:#2457a7;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1600" height="720" fill="white"/>
<text x="800" y="48" text-anchor="middle" class="title">TransWave: Exact Causal Raw-Byte Language Model</text>
<text x="800" y="80" text-anchor="middle" class="sub">learned 8-byte lifting • multiscale Meyer FIR • local causal path • exact within-block autoregression • no self-attention</text>

<rect x="35" y="135" rx="16" width="215" height="420" class="box"/>
<text x="142" y="172" text-anchor="middle" class="h">Raw UTF-8 bytes</text>
<text x="142" y="207" text-anchor="middle" class="t">x₁,…,xₜ ∈ {0,…,255}</text>
<rect x="64" y="242" rx="10" width="156" height="74" class="inner"/>
<text x="142" y="270" text-anchor="middle" class="t">32,768 bytes</text><text x="142" y="296" text-anchor="middle" class="small">per full context</text>
<text x="142" y="362" text-anchor="middle" class="t">No BPE</text><text x="142" y="388" text-anchor="middle" class="t">No SentencePiece</text><text x="142" y="414" text-anchor="middle" class="t">No offline tokenizer</text>
<text x="142" y="470" text-anchor="middle" class="small">one raw byte =</text><text x="142" y="492" text-anchor="middle" class="small">one LM token</text>
<path d="M250 345 L290 345" class="arrow"/>

<rect x="295" y="120" rx="16" width="275" height="450" class="box2"/>
<text x="432" y="158" text-anchor="middle" class="h">Learned 8-byte lifting</text><text x="432" y="186" text-anchor="middle" class="small">shared 256 × 96 byte embedding</text>
<rect x="330" y="215" rx="10" width="205" height="82" class="inner"/><text x="432" y="243" text-anchor="middle" class="t">3 lifting stages</text><text x="432" y="268" text-anchor="middle" class="small">even/odd predict-update</text><text x="432" y="291" text-anchor="middle" class="small">learned local corrections</text>
<text x="432" y="338" text-anchor="middle" class="t">detail lengths 4, 2, 1</text><text x="432" y="365" text-anchor="middle" class="t">+ final coarse = 8 scales</text>
<rect x="330" y="405" rx="10" width="205" height="92" class="inner"/><text x="432" y="433" text-anchor="middle" class="t">content-dependent</text><text x="432" y="458" text-anchor="middle" class="t">8 × 8 cross-scale mix</text><text x="432" y="483" text-anchor="middle" class="small">96 channels / scale</text>
<text x="432" y="530" text-anchor="middle" class="small">block state = 8 × 96 = 768</text>
<path d="M570 345 L610 345" class="arrow"/>

<rect x="615" y="105" rx="16" width="455" height="480" class="box"/>
<text x="842" y="145" text-anchor="middle" class="h">12 × TransWave layers</text>
<rect x="650" y="190" rx="12" width="180" height="270" class="inner"/><text x="740" y="222" text-anchor="middle" class="h">Short path</text><text x="740" y="267" text-anchor="middle" class="t">RMSNorm</text><text x="740" y="305" text-anchor="middle" class="t">causal depthwise</text><text x="740" y="329" text-anchor="middle" class="t">Conv1D</text><text x="740" y="365" text-anchor="middle" class="t">kernel = 7 blocks</text><text x="740" y="408" text-anchor="middle" class="small">strictly past/current</text><text x="740" y="431" text-anchor="middle" class="small">block history only</text>
<rect x="855" y="190" rx="12" width="180" height="270" class="inner"/><text x="945" y="222" text-anchor="middle" class="h">Long path</text><text x="945" y="261" text-anchor="middle" class="t">input gate</text><text x="945" y="289" text-anchor="middle" class="t">8 × 8 scale mix</text><text x="945" y="326" text-anchor="middle" class="t">causal Meyer FIR</text><text x="945" y="350" text-anchor="middle" class="t">512 blocks</text><text x="945" y="382" text-anchor="middle" class="small">12 bands × 8 controls</text><text x="945" y="411" text-anchor="middle" class="t">8 × 8 scale mix</text><text x="945" y="439" text-anchor="middle" class="t">output gate</text>
<text x="842" y="500" text-anchor="middle" class="t">gated residual fusion → RMSNorm → SwiGLU FFN (2816)</text><text x="842" y="535" text-anchor="middle" class="small">Meyer and local branches coexist in every layer</text>
<path d="M1070 345 L1110 345" class="arrow"/>

<rect x="1115" y="135" rx="16" width="205" height="420" class="box2"/>
<text x="1217" y="172" text-anchor="middle" class="h">Exact causal shift</text><text x="1217" y="217" text-anchor="middle" class="t">completed block h[b]</text><text x="1217" y="250" text-anchor="middle" class="t">is shifted by 1</text>
<rect x="1145" y="285" rx="10" width="145" height="78" class="inner"/><text x="1217" y="315" text-anchor="middle" class="t">predict block b</text><text x="1217" y="342" text-anchor="middle" class="t">from h[b−1]</text>
<text x="1217" y="410" text-anchor="middle" class="small">future blocks cannot</text><text x="1217" y="432" text-anchor="middle" class="small">enter the context</text><text x="1217" y="485" text-anchor="middle" class="small">executable causality test</text><text x="1217" y="507" text-anchor="middle" class="small">included in source</text>
<path d="M1320 345 L1360 345" class="arrow"/>

<rect x="1365" y="120" rx="16" width="205" height="450" class="box"/>
<text x="1467" y="158" text-anchor="middle" class="h">Byte decoder</text><text x="1467" y="203" text-anchor="middle" class="t">8-byte GRU</text><text x="1467" y="233" text-anchor="middle" class="small">teacher-forced within block</text><text x="1467" y="284" text-anchor="middle" class="t">byte r+1 sees</text><text x="1467" y="310" text-anchor="middle" class="t">true bytes ≤ r</text>
<rect x="1395" y="350" rx="10" width="145" height="85" class="inner"/><text x="1467" y="380" text-anchor="middle" class="t">shared byte</text><text x="1467" y="406" text-anchor="middle" class="t">embedding head</text><text x="1467" y="478" text-anchor="middle" class="t">exact next-byte NLL</text><text x="1467" y="510" text-anchor="middle" class="small">p(xₜ | x&lt;t)</text>
<rect x="255" y="625" rx="14" width="1090" height="58" fill="#eef6ff" stroke="#94b8e3" stroke-width="1.5"/><text x="800" y="660" text-anchor="middle" class="h">126,746 parameters • 4096 block positions • 32,768-byte context • attention-free causal sequence mixing</text>
</svg>
